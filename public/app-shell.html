<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0c0a09" />
    <title>SoloPulse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0c0a09;
        color: #fafaf9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      h1 span {
        color: #f59e0b;
      }
      p {
        color: #a8a29e;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 12px;
        background: #f59e0b;
        color: #1c1917;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Solo<span>Pulse</span></h1>
      <p>
        솔로 채굴 모니터를 불러오는 중입니다.<br />
        네트워크 연결을 확인해 주세요.
      </p>
      <a href="https://solopulse.paekfeel.workers.dev">웹으로 열기</a>
    </div>
    <script>
      // If opened as offline fallback, try live app
      if (navigator.onLine) {
        location.replace("https://solopulse.paekfeel.workers.dev/");
      }
    </script>
  </body>
</html>
